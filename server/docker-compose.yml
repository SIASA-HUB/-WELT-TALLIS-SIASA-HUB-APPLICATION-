services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8009:8009"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    container_name: users-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    container_name: wallet-service
    ports:
      - "8008:8008"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  leaders-service:
    build:
      context: .
      dockerfile: leaders-service/Dockerfile
    container_name: leaders-service
    ports:
      - "8006:8006"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    volumes:
      - ./leaders-service/uploads:/usr/src/app/leaders-service/uploads

  rally-service:
    build:
      context: .
      dockerfile: rally-service/Dockerfile
    container_name: rally-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./rally-service/uploads:/usr/src/app/rally-service/uploads

  endorsement-service:
    build:
      context: .
      dockerfile: endorsement-service/Dockerfile
    container_name: endorsement-service
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./endorsement-service/uploads:/usr/src/app/endorsement-service/uploads

  marketplace-service:
    build:
      context: .
      dockerfile: marketplace-service/Dockerfile
    container_name: marketplace-service
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./marketplace-service/uploads:/usr/src/app/marketplace-service/uploads

  redis:
    image: redis:alpine
    container_name: shared-redis
    volumes:
      - redis-data:/data

  db:
    image: mariadb:11
    container_name: shared-db
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shared-rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

networks:
  default:
    name: siasa-network
    external: true

volumes:
  redis-data:
  db-data:
  rabbitmq-data: