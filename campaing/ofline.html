<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siasa Hub - Offline</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      .container {
        max-width: 400px;
      }
      img {
        width: 100px;
        height: 100px;
        border-radius: 20px;
        margin-bottom: 20px;
      }
      h1 {
        color: #bb0000;
        font-size: 24px;
        margin-bottom: 10px;
      }
      p {
        color: #666;
        margin-bottom: 30px;
      }
      button {
        background: #bb0000;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 30px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/image/logo.png" alt="Siasa Hub" />
      <h1>You're Offline</h1>
      <p>Connect to the internet to continue using Siasa Hub</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
