version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8009/api/v1}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    container_name: siasa-hub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production

networks:
  default:
    name: siasa-network
