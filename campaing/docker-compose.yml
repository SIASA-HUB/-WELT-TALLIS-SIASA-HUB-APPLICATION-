services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://siasahub.co.ke/api/v1}
        VITE_IMAGE_BASE_URL: ${VITE_IMAGE_BASE_URL:-https://siasahub.co.ke}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    container_name: siasa-hub-frontend
    restart: unless-stopped
    ports:
      - "8081:80"  # Changed from 8080 to 8081 to avoid confusion
    environment:
      - NODE_ENV=production
    networks:
      - siasa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  siasa-network:
    external: true