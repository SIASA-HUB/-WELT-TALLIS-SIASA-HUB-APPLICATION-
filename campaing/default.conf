server {
    listen 80;
    server_name localhost;

    # Root directory for SPA built files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # Try files policy to support React/Vue client-side routing
    location / {
        # SEO BOT DETECTION
        set $prerender 0;
        if ($http_user_agent ~* "googlebot|bingbot|yandex|baiduspider|twitterbot|facebookexternalhit|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkShare|W3C_Validator") {
            set $prerender 1;
        }

        # If it is a bot and requests a leader profile, proxy to API Gateway SEO Renderer
        if ($uri ~* "^/leaders/([^/]+)") {
            set $prerender "${prerender}L";
        }

        # If it is a bot and requests a marketplace product, proxy to API Gateway SEO Renderer
        if ($uri ~* "^/marketplace/product/([^/]+)") {
            set $prerender "${prerender}M";
        }

        # If bot + leader route -> Proxy to node SEO renderer
        if ($prerender = "1L") {
            rewrite ^/leaders/(.*)$ /seo/leader/$1 break;
            proxy_pass http://host.docker.internal:8009;
        }

        # If bot + marketplace product route -> Proxy to node SEO renderer
        if ($prerender = "1M") {
            rewrite ^/marketplace/product/(.*)$ /seo/marketplace/product/$1 break;
            proxy_pass http://host.docker.internal:8009;
        }

        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # API Proxy (Opionally handled differently, but good to ensure no direct conflict)
    location /api {
        proxy_pass http://host.docker.internal:8009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Handle error pages neatly
    error_page 404 /index.html;
    error_page 500 502 503 504 /error.html;
    location = /error.html {
        root /usr/share/nginx/html;
        internal;
    }
}
