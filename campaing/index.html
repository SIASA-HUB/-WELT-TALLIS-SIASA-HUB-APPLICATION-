  <!--  CSS INLINE-->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      background: #000;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      color: white;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    /* loader and top line */
    #top-loader-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #bb0000, #ff4444);
      z-index: 10001;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 6px #ff0000;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10000;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(0px);
    }

    .loader-logo-img {
      width: 130px;
      height: auto;
      animation: fadeInUp 0.5s ease-out;
      filter: drop-shadow(0 0 8px rgba(187, 0, 0, 0.3));
    }

    .loader-sub {
      font-size: 11px;
      color: #aaa;
      margin-top: 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* quick placeholder for root content (avoid FOUC) */
    #root {
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* PWA banner */
    #pwa-banner {
      position: fixed;
      bottom: 70px;
      left: 16px;
      right: 16px;
      background: rgba(17, 17, 17, 0.98);
      backdrop-filter: blur(20px);
      padding: 16px;
      border-radius: 20px;
      display: none;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(187, 0, 0, 0.4);
      z-index: 9999;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    #pwa-banner button {
      cursor: pointer;
      transition: 0.2s;
    }

    #pwa-btn:hover {
      background: #e00000 !important;
      transform: scale(0.97);
    }

    /* Hardware accelerated loader */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
      }
    }
  </style>

<body>
  <div id="top-loader-line"></div>
  <div id="initial-loader">
    <img src="/image/siasa.png" alt="SiasaHub | Kenya Elections 2027" class="loader-logo-img" />
    <div class="loader-sub">📊 MANIFESTO HUB · 2027 DATA CENTER</div>
  </div>
  <div id="pwa-banner">
    <div style="flex:1;">
      <strong style="font-size: 14px; display: block;">📲 Siasa Hub App</strong>
      <span style="font-size: 11px; color: #ccc;">Install for faster updates & offline mode</span>
    </div>
    <button id="pwa-btn"
      style="background:#bb0000; color:#fff; border:none; padding:8px 18px; border-radius:40px; font-weight:600; margin-right:8px;">Install</button>
    <button id="pwa-close"
      style="background:transparent; border:none; color:#fff; font-size:20px; line-height:1;">✕</button>
  </div>
  <div id="root"></div>

  <script>
    // --------------------------------------------------------------
    // loader 
    // --------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('initial-loader');
      const line = document.getElementById('top-loader-line');
      if (line) line.style.width = '60%';
    });

    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      const line = document.getElementById('top-loader-line');
      const rootEl = document.getElementById('root');
      if (line) line.style.width = '100%';
      setTimeout(() => {
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.display = 'none';
            if (rootEl) rootEl.style.opacity = '1';
          }, 350);
        } else {
          if (rootEl) rootEl.style.opacity = '1';
        }
      }, 400);
    });

    // --------------------------------------------------------------
    // 2. PWA Installation with improved UX
    // --------------------------------------------------------------
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const dismissed = localStorage.getItem('pwa-dismissed');
      if (!dismissed) {
        setTimeout(() => {
          const banner = document.getElementById('pwa-banner');
          if (banner) banner.style.display = 'flex';
        }, 2800);
      }
    });

    const pwaBtn = document.getElementById('pwa-btn');
    const pwaClose = document.getElementById('pwa-close');
    if (pwaBtn) {
      pwaBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            document.getElementById('pwa-banner').style.display = 'none';
            localStorage.setItem('pwa-installed', 'true');
          }
          deferredPrompt = null;
        } else {
          // fallback: maybe already installed
          document.getElementById('pwa-banner').style.display = 'none';
        }
      });
    }
    if (pwaClose) {
      pwaClose.addEventListener('click', () => {
        document.getElementById('pwa-banner').style.display = 'none';
        localStorage.setItem('pwa-dismissed', 'true');
      });
    }


    if ('serviceWorker' in navigator && window.location.hostname !== 'localhost') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log("SW not registered", err));
      });
    }


    const updateCopyright = () => {
      const yearSpan = document.querySelector('.current-year');
      if (yearSpan) yearSpan.innerText = new Date().getFullYear();
    };
    setTimeout(updateCopyright, 100);
  </script>
