<!doctype html>
<html lang="en-KE">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>Siasa Hub 🇰🇪 - Your Political Campaign Command Center</title>

  <link rel="icon" type="image/png" href="/image/siasa.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <meta name="image" content="https://siasahub.co.ke/image/siasa.png" />

  <meta name="theme-color" content="#000000" />
  <meta name="description"
    content="SiasaHub 🇰🇪 is Kenya's definitive political campaign command center. Discover official candidate profiles, manifestos, real-time analytics, and merchandise for the 2027 General Election. The Wikipedia of Kenyan Politics." />
  <meta name="keywords" content="SiasaHub, Siasa Hub, Kenya Elections 2027, Kenyan Politicians, IEBC, UDA, ODM, Jubilee, Wiper, Nairobi Politics, Campaign Merchandise, Political Analytics Kenya, 2027 General Election, Kenyan Candidates, Manifestos, Political Endorsements" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Siasa Hub 🇰🇪 - Official Candidate Profiles" />
  <meta property="og:description"
    content="Explore manifestos and real-time analytics for the 2027 Kenyan General Election." />
  <meta property="og:image" content="https://siasahub.co.ke/icons/og-image.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta name="geo.region" content="KE" />
  <link rel="manifest" href="/manifest.json" />

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SiasaHub",
        "url": "https://siasahub.co.ke",
        "logo": "https://siasahub.co.ke/image/siasa.png",
        "description": "The Command Center for Kenyan Campaigns."
      }
    </script>

  <link rel="preload" href="/bootstrap/css/bootstrap.min.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
  </noscript>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      background: #000;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      color: white;
      font-family: -apple-system, sans-serif;
    }

    #top-loader-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #bb0000, #ff4444);
      z-index: 10001;
      transition: width 0.3s ease;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10000;
    }

    .loader-logo-img {
      width: 120px;
      height: auto;
      animation: fadeInUp 0.6s ease-out;
    }

    .loader-sub {
      font-size: 10px;
      color: #666;
      margin-top: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* PWA Banner Styles */
    #pwa-banner {
      position: fixed;
      bottom: 70px;
      left: 16px;
      right: 16px;
      background: rgba(17, 17, 17, 0.98);
      backdrop-filter: blur(20px);
      padding: 16px;
      border-radius: 16px;
      display: none;
      align-items: center;
      border: 1px solid rgba(187, 0, 0, 0.3);
      z-index: 9999;
    }
  </style>
</head>

<body>
  <div id="top-loader-line"></div>

  <div id="initial-loader">
    <img src="/image/siasa.png" alt="SiasaHub" class="loader-logo-img" />
    <div class="loader-sub">CAMPAIGN COMMAND CENTER</div>
  </div>

  <div id="pwa-banner">
    <div style="flex: 1;">
      <strong style="font-size: 14px; display: block;">Add Siasa Hub to Home Screen</strong>
      <span style="font-size: 11px; color: #aaa;">Faster access & offline support</span>
    </div>
    <button id="pwa-btn"
      style="background: #bb0000; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; margin-right: 8px;">Install</button>
    <button id="pwa-close" style="background: none; border: none; color: #fff;">✕</button>
  </div>

  <div id="root"></div>

  <script>
    // 1. Loader Animation Logic
    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      const line = document.getElementById('top-loader-line');
      line.style.width = '100%';
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
      }, 500);
    });

    // 2. PWA Logic
    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem("pwa-dismissed")) {
        setTimeout(() => document.getElementById("pwa-banner").style.display = "flex", 3000);
      }
    });

    document.getElementById("pwa-btn").addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") document.getElementById("pwa-banner").style.display = "none";
        deferredPrompt = null;
      }
    });

    document.getElementById("pwa-close").addEventListener("click", () => {
      document.getElementById("pwa-banner").style.display = "none";
      localStorage.setItem("pwa-dismissed", "true");
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
