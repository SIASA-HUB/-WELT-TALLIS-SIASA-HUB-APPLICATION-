<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      http-equiv="Cache-Control"
      content="max-age=31536000, must-revalidate"
    />

    <title>Siasa Hub 🇰🇪 | Kenya's Digital Political Engagement</title>

    <meta
      name="description"
      content="Connect with Kenyan political leaders and participate in real-time polls."
    />
    <meta property="og:title" content="Siasa Hub 🇰🇪" />
    <meta property="og:image" content="/image/og-banner.png" />
    <meta name="theme-color" content="#0f172a" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://bundle-unexpected-sustainability-idol.trycloudflare.com"
      crossorigin
    />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <link rel="modulepreload" href="/src/main.jsx" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        overflow-x: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #f8fafc;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.2s ease-out,
          visibility 0.2s;
      }
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(187, 0, 0, 0.1);
        border-top: 3px solid #bb0000;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-bottom: 15px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      body.loaded #initial-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <h1
        style="
          font-size: 1.4rem;
          font-weight: 900;
          letter-spacing: -1px;
          color: #0f172a;
          font-family: sans-serif;
        "
      >
        SIASA HUB
      </h1>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        const hideLoader = () => document.body.classList.add("loaded");

        if (
          document.readyState === "interactive" ||
          document.readyState === "complete"
        ) {
          hideLoader();
        } else {
          document.addEventListener("DOMContentLoaded", hideLoader);
        }

        // SW Registration
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => {
            navigator.serviceWorker
              .register("/service_worker.js")
              .catch((err) => console.error("SW failed:", err));
          });
        }

        setTimeout(hideLoader, 3500);
      })();
    </script>
  </body>
</html>
