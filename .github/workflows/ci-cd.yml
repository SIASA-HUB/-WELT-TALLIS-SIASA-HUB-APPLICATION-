name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # FRONTEND CHECK
  frontend-check:
    name: Frontend – Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campaing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create frontend .env for CI
        run: echo "${{ secrets.FRONTEND_ENV }}" > .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: campaing/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build (production)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: campaing/dist
          retention-days: 1

  # BACKEND CHECK
  backend-check:
    name: Backend – Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create server .env for CI
        run: echo "${{ secrets.SERVER_ENV }}" > server/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose syntax
        run: |
          docker compose -f server/docker-compose.yml config --quiet
          echo "server/docker-compose.yml is valid"

      - name: Build backend images (no push)
        working-directory: server
        run: |
          docker compose build \
            --no-cache \
            --progress=plain \
            2>&1 | tee /tmp/build.log
          if grep -i "^error" /tmp/build.log; then
            echo "Build errors detected"
            exit 1
          fi
          echo "All backend images built successfully"

  # DEPLOY 
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Write backend .env on server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "printf '%s' '${{ secrets.SERVER_ENV }}' > ${{ secrets.DEPLOY_PATH }}/server/.env"

      - name: Deploy backend services
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            echo "Rebuilding backend..."
            cd server
            docker compose up -d --build --remove-orphans

            echo "Waiting for services..."
            sleep 15

            docker compose ps
            echo "Backend deploy complete"
          ENDSSH

      - name: Deploy frontend
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            cd "${{ secrets.DEPLOY_PATH }}/campaing"

            echo "Rebuilding frontend..."
            docker compose up -d --build --remove-orphans

            echo "Frontend deploy complete"
          ENDSSH

      - name: Health checks
        run: |
          sleep 10
          HOST=${{ secrets.SSH_HOST }}

          GATEWAY=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$HOST:8009/health" || echo "000")
          echo "API Gateway: HTTP $GATEWAY"

          FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$HOST:8080" || echo "000")
          echo "Frontend: HTTP $FRONTEND"

          if [ "$FRONTEND" != "200" ]; then
            echo "Frontend health check failed"
            exit 1
          fi

          echo "All health checks passed!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "DEPLOY FAILED — commit ${{ github.sha }} by ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
